name: Lint

# Static checks for everything the other workflows do not execute:
# shell scripts, Python syntax and undefined names, and the JavaScript
# embedded in the HTML templates.

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Shell scripts - syntax
        run: |
          for script in scripts/*.sh tests/run_tests.sh; do
            bash -n "$script"
          done

      - name: Shell scripts - shellcheck
        run: shellcheck --severity=warning scripts/*.sh tests/run_tests.sh

      - name: Python - compiles
        run: python -m py_compile picamctl.py scripts/*.py tests/*.py tests/fakes/rpicam-vid tests/fakes/rpicam-still

      - name: Python - syntax errors and undefined names
        run: |
          pip install -q ruff
          ruff check --select E9,F63,F7,F82 picamctl.py scripts tests tests/fakes/rpicam-vid tests/fakes/rpicam-still

      - name: Templates - inline JavaScript syntax
        run: node tests/check_template_js.js templates/*.html
