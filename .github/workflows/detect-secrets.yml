name: Detect Secrets

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  detect-secrets:
    name: Detect potential secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets==1.5.0

      - name: Scan tracked files against the baseline
        run: |
          if [ ! -f .secrets.baseline ]; then
            echo ".secrets.baseline not found in repo. Please generate and commit a baseline." >&2
            exit 2
          fi
          # Fails when a tracked file holds a potential secret that is not in .secrets.baseline.
          # If a finding is intentional, audit it and update the baseline:
          #   detect-secrets scan --baseline .secrets.baseline && detect-secrets audit .secrets.baseline
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
