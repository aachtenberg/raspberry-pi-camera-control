name: Stream Tests

# Runs the real app and the real ffmpeg HLS stage against a fake camera
# (tests/fakes), so segment length, bitrate and the on-demand start/stop
# cycle are checked without a Raspberry Pi.

on:
  pull_request:
    paths:
      - 'picamctl.py'
      - 'templates/**'
      - 'static/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test-stream.yml'
  push:
    branches:
      - master
    paths:
      - 'picamctl.py'
      - 'templates/**'
      - 'static/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test-stream.yml'

jobs:
  test-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements.txt pytest

      - name: Run stream tests
        env:
          STREAM_TEST_WORKDIR: ${{ runner.temp }}/stream-test
        run: pytest -v tests/test_stream.py

      - name: Show app and fake camera logs
        if: failure()
        run: |
          echo "---- app.log (last 150 lines)"
          tail -n 150 "$RUNNER_TEMP/stream-test/app.log" || true
          echo "---- fake_camera.log"
          cat "$RUNNER_TEMP/stream-test/fake_camera.log" || true
